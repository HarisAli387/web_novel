<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Novela by Haris</title>
  <link rel="stylesheet" href="globals.css">
  <style>
    .contact-form {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid #e2e8f0;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #0f172a;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="nav-logo">Novela by Haris</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="novels.html">Novels</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <section class="hero" style="padding: 4rem 2rem;">
    <h1>Get in Touch</h1>
    <p>Have a question, feedback, or just want to say hello? I'd love to hear from you.</p>
  </section>

  <section style="padding: 0 2rem 4rem;">
    <form action="https://formsubmit.co/harisrahat95@gmail.com" method="POST" class="contact-form">
      <input type="hidden" name="_next" value="https://yourdomain.com/thankyou.html">
      <input type="hidden" name="_captcha" value="false">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Tell me what's on your mind..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Novela by Haris. All rights reserved.</p>
  </footer>

</body>
</html>
